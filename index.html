<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Sign-up Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="flex">
            <img src="img/odin-lined.png" alt="" id="logo">
            
            <h1>
                Odin
                <span class="visually-hidden">Sign-up Form</span>
            </h1>
        </div>



    </header>
    <main>
        <p>This is not a real online service! You know you need something like this in your life to help you realise
            your deepest dreams. Sign up <em>now</em> to get started.</p>
        <p>You <em>know</em> you want to.</p>

        <form>
            <h2>Let's do this!</h2>
            <div id="row1">
                <div>
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname">
                </div>
                <div>
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname">
                </div>
            </div>
            <div id="row2">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </div>
            <div id="row3">
                <div>
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="pwd">
                </div>
                <div>
                    <label for="pwd2">Confirm Password</label>
                    <input type="password" id="pwd2" name="pwd">
                </div>
            </div>
            <div id="row4">
                <button type="submit">Create Account</button>
            </div>




        </form>
        <div>
            <p>Already have an account? <a href="#">Log in.</a></p>
        </div>
    </main>

</body>

</html>
